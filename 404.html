<!doctype html>
<html lang="en">
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | t.m.yach</title>

    <link rel="stylesheet" href="stylesheet.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="fonts.css">
    <script defer src="theme.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,100..900;1,100..900&family=Gochi+Hand&family=Momo+Signature&family=Momo+Trust+Display&family=Momo+Trust+Sans:wght@200..800&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Sono:wght,MONO@200..800,1&family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=swap" rel="stylesheet">

    <!--favicon-->
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
<link rel="shortcut icon" href="favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
<link rel="manifest" href="favicon/site.webmanifest" />
    
  <style>
    .error-main {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
    }

    .error-frame {
      width: 100%;
      max-width: 860px;
      text-align: center;
    }

    .dino {
      display: block;
      width: 100%;
      height: 300px;
      max-width: 100%;
      margin-top: 1.5rem;
      border: var(--border-thin-solid);
      border-radius: 8px;
      background: #f7f7f7;
      overflow: hidden;
      aspect-ratio: 2 / 1;
    }

    @media (max-width: 640px) {
      .error-main {
        padding: 1rem 0.75rem;
      }

      .error-frame {
        max-width: 100%;
      }

      .error-code {
        font-size: 3rem;
      }

      .error-sub {
        font-size: 1.25rem;
      }

      .dino {
        height: 220px;
        min-height: 220px;
        margin-top: 1rem;
      }
    }

    @media (min-width: 641px) {
      .dino {
        height: 320px;
      }
    }

    .error-code {
      color: var(--primary);
      font-family: var(--font-title);
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 0.5rem;
      padding: 10px;
    }

    .error-sub {
      color: var(--ink);
      font-family: var(--font-hwr);
      font-size: 1.6rem;
      margin-bottom: 0.8rem;
    }

    .error-text {
      color: var(--ink-soft);
      margin-bottom: 1.5rem;
    }

    .homel {
      text-decoration: none;
      text-transform: lowercase;
    }
  </style>
  </head>
<body>
  <div class="page">
    <header class="header max-width">
      <a class="logo" href="/">
        <span class="main-tag">t.m.yach</span>
      </a>
      <div class="nav-divider-large"></div>
      <nav class="nav">
        <ul class="nav-list">
          <li><a href="/">Home</a></li>
        </ul>
        <div class="nav-divider"></div>
        <div class="theme-switch">
          <label for="theme-select" class="sr-only">Theme</label>
          <select id="theme-select">
            <option value="dark">Dark &#x1F31A;</option>
            <option value="light">Light &#x1F31E;</option>
            <option value="darkred">Red &#x1F352;</option>
            <option value="pink">Pink &#x1F338;</option>
            <option value="sephpink">1wing &#x1FABD;</option>
            <option value="synthwave">Neon &#x1F303;</option>
          </select>
        </div>
      </nav>
    </header>

    <main class="main-frame error-main">
      <section class="block error-frame">
        <h1 class="error-code">404</h1>
        <h2 class="error-sub">page not found :(</h2>
        <p class="error-text">But hey, at least you get to play a fun game! Have at it lol</p>
        <a href="/" class="button homel">back to home</a>
        <iframe class="dino" src="dino.html" title="Dino game"></iframe>
      </section>
    </main>

    <footer class="footer">
      <div class="max-width">
        <p>t.m.yach, the bird's eye view</p>
      </div>
      </footer>
    </div>
    <script src="menu.js"></script>
</body>
</html>
