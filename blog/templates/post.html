{% extends "default.html" %}

{% block main %}
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>

    {% if page.time %}
    <p class="date">{{ page.time }}</p>
    {% endif %}

    {% if page.tags %}
    <div class="tags">
      <span>Posted in </span>
      {% for t in page.tags %}
      <span class="tag">
        <a href="{{ pctagurl(t) }}">{{ t }}</a>{% if not loop.last %}, {% endif %}
      </span>
      {% endfor %}
    </div>
    {% endif %}
  </header>

  <section class="post-content">
    {{ content|safe }}
  </section>
</article>
{% endblock %}
